name: Generate Spor Toto Predictions

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "matches.json"
  schedule:
    # Her Pazartesi 06:00 UTC (TR saatiyle 09:00)
    - cron: "0 6 * * 1"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate predictions and index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python main.py

      - name: Prepare publish directory
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Weekly predictions update [skip ci]"
